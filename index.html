<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố Cục 5 Phần Bằng CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="grid-container">
        <!-- 1. Header -->
        <header class="header">Header (Tiêu đề trang)</header>

        <!-- 2. Navigation -->
        <nav class="navigation">Navigation (Menu điều hướng)</nav>

        <!-- 3. Main Content -->
        <main class="main-content">
            <h2>Main Content (Nội dung chính)</h2>
            <p>Đây là khu vực hiển thị các bài viết, nội dung chi tiết của trang web.</p>
        </main>

        <!-- 4. Sidebar -->
        <aside class="sidebar">
            <h3>Sidebar (Cột phụ)</h3>
            <p>Tin tức, Quảng cáo...</p>
        </aside>

        <!-- 5. Footer -->
        <footer class="footer">Footer (Thông tin cuối trang)</footer>
    </div>

</body>
</html>
